[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-paper"
version = "0.1.1"
description = "A daily e-reader newspaper: FreshRSS + widgets, curated by an LLM, built as an EPUB and emailed to a Kindle."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6",
  "feedparser>=6.0.11",
  "trafilatura>=1.12",
  "lxml>=5",
  "lxml_html_clean>=0.4",
  "ebooklib>=0.18",
  "Pillow>=10.1",
  "Markdown>=3.6",
  "icalendar>=6",
  "recurring-ical-events>=3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
morning-paper = "morning_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
